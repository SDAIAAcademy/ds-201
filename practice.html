<section>
<h2>Day 1: Variation</h2>
<ol>
<li><p>Ilyas reads 50 meters each month and reports the mean. Over the year his twelve means ran from 430 to 515 litres. Which statement explains the range best?</p><ul><li><b>A.</b> Households use between 430 and 515 litres a day</li><li><b>B.</b> Consumption rose and fell during the year</li><li><b>C.</b> Means of samples of 50 scatter by about 30 litres around the truth</li><li><b>D.</b> Some of the monthly samples were drawn incorrectly</li></ul></li>
<li><p>From 400 households: mean 468 litres, standard deviation 204, standard error 10. Jamila asks: "How sure are we about the 468?" Which reply is right?</p><ul><li><b>A.</b> The true average is very likely within about 20 litres of 468</li><li><b>B.</b> The true average could be anywhere within 204 litres of 468</li><li><b>C.</b> Nearly all households use between 448 and 488 litres</li><li><b>D.</b> With 400 households the 468 is exact</li></ul></li>
<li><p>The contract promises customers that "a typical leak is repaired within 8 hours". This month: mean 15.3 hours, median 6.5 hours, one ticket of 1,450 hours. What should Nizar report against the promise?</p><ul><li><b>A.</b> The mean, 15.3 hours: the promise was broken</li><li><b>B.</b> The mean after deleting the long ticket, with no note</li><li><b>C.</b> The midpoint of mean and median, 10.9 hours</li><li><b>D.</b> The median, 6.5 hours, and the long ticket named separately</li></ul></li>
<li><p>Four drafts describe the same 300 repairs, one of which is a late-entry ticket of 663.5 hours. Which one can a reader check and rely on?</p><ul><li><b>A.</b> Repairs took 10.4 ± 38.4 hours on average</li><li><b>B.</b> Of 300 sampled repairs the median was 6.2 hours (quartiles 3.7 and 10.4); one late-entry ticket is listed apart</li><li><b>C.</b> Repairs typically take about six hours</li><li><b>D.</b> All of Zulal's repairs have a median of exactly 6.2 hours</li></ul></li>
<li><p>A utility has 60,000 customers. An analyst phones 80 of them and finds that 35% would pay bills through an app. Which of these is the statistic?</p><ul><li><b>A.</b> The share of all 60,000 customers who would pay by app</li><li><b>B.</b> The 35% found among the 80 customers phoned</li><li><b>C.</b> The 80 customers who were phoned</li><li><b>D.</b> The 60,000 customers of the utility</li></ul></li>
<li><p>An analyst draws 500 samples of 40 households and plots a histogram of the 500 sample means. What does one bar of this histogram count?</p><ul><li><b>A.</b> Households whose consumption falls in that range</li><li><b>B.</b> Litres consumed by the households in that range</li><li><b>C.</b> Samples whose mean falls in that range</li><li><b>D.</b> Households that appear in more than one sample</li></ul></li>
<li><p>Two analysts each read 60 meters drawn at random from the same population, on the same day. One reports a mean of 452 litres, the other 489 litres. Both followed the method correctly. What explains the gap best?</p><ul><li><b>A.</b> Each sample is one draw of many, and means of 60 vary from draw to draw</li><li><b>B.</b> One of the two samples must contain a recording error</li><li><b>C.</b> The population mean must have changed in the time between the first sample and the second</li><li><b>D.</b> Samples of 60 are too small to give any usable mean</li></ul></li>
<li><p>A sample of 225 households has a mean consumption of 480 litres and a standard deviation of 180 litres. What is the estimated standard error of the mean?</p><ul><li><b>A.</b> 0.8 litres</li><li><b>B.</b> 12 litres</li><li><b>C.</b> 32 litres</li><li><b>D.</b> 180 litres</li></ul></li>
<li><p>With 100 households the standard error of mean consumption is 20 litres. The manager wants a standard error of 5 litres. About how many households are needed?</p><ul><li><b>A.</b> 200 households</li><li><b>B.</b> 400 households</li><li><b>C.</b> 800 households</li><li><b>D.</b> 1,600 households</li></ul></li>
<li><p>A report on 900 households says: "Mean consumption 465 litres (SD 210, SE 7)". A planner needs to know how much a single household can differ from the average. Which number answers the planner?</p><ul><li><b>A.</b> The SD, 210 litres</li><li><b>B.</b> The SE, 7 litres</li><li><b>C.</b> Twice the SE, 14 litres</li><li><b>D.</b> The mean, 465 litres</li></ul></li>
<li><p>Complaint resolution times at a call centre have a median of 4 hours and a mean of 9 hours. What does that pair of numbers tell you about the distribution?</p><ul><li><b>A.</b> It is symmetric around 6.5 hours</li><li><b>B.</b> It has a long tail of short resolutions</li><li><b>C.</b> It has a long tail of long resolutions</li><li><b>D.</b> It contains a calculation error</li></ul></li>
<li><p>A sample of 99 repairs has a mean of 8.0 hours and a median of 6.0 hours. One more ticket of 808 hours is added. What happens to the two summaries, approximately?</p><ul><li><b>A.</b> Mean 8.1 hours, median 14 hours</li><li><b>B.</b> Mean 16 hours, median 6 hours</li><li><b>C.</b> Mean 16 hours, median 14 hours</li><li><b>D.</b> Mean 8.1 hours, median 6 hours</li></ul></li>
<li><p>The finance team asks how many crew hours were paid for 3,000 repairs last quarter. The repair times are strongly skewed. Which summary should the analyst multiply by 3,000?</p><ul><li><b>A.</b> The median repair time</li><li><b>B.</b> The trimmed mean repair time</li><li><b>C.</b> The mean repair time</li><li><b>D.</b> The most frequent repair time</li></ul></li>
<li><p>A sample of waiting times has first quartile 12 minutes, median 20 minutes and third quartile 34 minutes. What is the interquartile range?</p><ul><li><b>A.</b> 8 minutes</li><li><b>B.</b> 14 minutes</li><li><b>C.</b> 20 minutes</li><li><b>D.</b> 22 minutes</li></ul></li>
<li><p>An analyst summarises 250 skewed repair times, three of which are tickets closed weeks late. Which sentence gives a reader what is needed to rely on the summary?</p><ul><li><b>A.</b> Repairs took 11 hours on average, give or take 40</li><li><b>B.</b> Of 250 sampled repairs the median was 6 hours and the quartiles 4 and 10; 3 late tickets are listed apart</li><li><b>C.</b> The typical repair at the utility takes 6 hours</li><li><b>D.</b> After cleaning, the mean repair time was 7 hours</li></ul></li>
<li><p>A table of median repair time by district is built from a sample of 300 repairs. District D30 has 4 repairs in the sample and the highest median of all. What should the analyst do with that row?</p><ul><li><b>A.</b> Report it as the worst district</li><li><b>B.</b> Withhold the number and state that the count is too small</li><li><b>C.</b> Replace it with the overall median</li><li><b>D.</b> Delete the district from the table without a note</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Intervals</h2>
<ol>
<li><p>From 100 households: mean 490 litres, standard deviation 200, standard error 20. Zulal reads 400 households next time. What do you expect?</p><ul><li><b>A.</b> Standard deviation about 100, standard error about 20</li><li><b>B.</b> Standard deviation about 200, standard error about 10</li><li><b>C.</b> Standard deviation about 200, standard error about 5</li><li><b>D.</b> Standard deviation about 100, standard error about 10</li></ul></li>
<li><p>You have 80 survey scores and want an interval for their median. Which step, repeated 2,000 times, gives the bootstrap distribution?</p><ul><li><b>A.</b> Shuffle the 80 scores and take their median</li><li><b>B.</b> Draw 40 of the 80 scores at random and take their median</li><li><b>C.</b> Draw 80 new scores from all customers and take their median</li><li><b>D.</b> Draw 80 scores from the 80 with replacement and take their median</li></ul></li>
<li><p>From 150 repairs Ilyas computes a 95% interval for the median repair time: 5.0 to 7.5 hours. Which sentence is correct?</p><ul><li><b>A.</b> The method that gave this interval catches the true median in about 95 of 100 studies</li><li><b>B.</b> About 95% of repairs take between 5.0 and 7.5 hours</li><li><b>C.</b> The true median has a 95% chance of lying between 5.0 and 7.5 hours</li><li><b>D.</b> In 95% of future samples the median will be between 5.0 and 7.5 hours</li></ul></li>
<li><p>To estimate mean water pressure, Zulal picks 25 streets at random and measures the pressure at 8 houses on each: 200 readings. Which bootstrap gives an honest interval for the mean?</p><ul><li><b>A.</b> Resample the 200 readings</li><li><b>B.</b> Resample 8 readings within each street</li><li><b>C.</b> Resample the 25 streets, each with its 8 readings</li><li><b>D.</b> Resample 100 of the 200 readings</li></ul></li>
<li><p>A study compares the median time to answer a call at two desks. Ratio North / South: 1.30, 95% interval 1.08 to 1.57. What may the analyst report?</p><ul><li><b>A.</b> No gap is shown, because the interval does not include 0</li><li><b>B.</b> North is slower: between 8% and 57% longer than South</li><li><b>C.</b> North is slower by exactly 30%</li><li><b>D.</b> North takes between 1.08 and 1.57 hours longer than South</li></ul></li>
<li><p>An analyst has 120 call durations and bootstraps their median. Why is each resample drawn with replacement?</p><ul><li><b>A.</b> So that resamples differ from one another the way real samples would</li><li><b>B.</b> So that each resample is larger than the original sample</li><li><b>C.</b> So that extreme durations are removed from the resamples</li><li><b>D.</b> So that every one of the 120 durations appears exactly once in each resample</li></ul></li>
<li><p>From 1,000 bootstrap medians, sorted from smallest to largest, an analyst wants the 90% percentile interval. Which two sorted values are its ends?</p><ul><li><b>A.</b> The 25th and the 975th</li><li><b>B.</b> The 50th and the 950th</li><li><b>C.</b> The 100th and the 900th</li><li><b>D.</b> The 1st and the 1,000th</li></ul></li>
<li><p>A bootstrap interval for a median from 90 tickets is 4.8 to 7.9 hours with 2,000 resamples. The manager finds it too wide. Which action would narrow it?</p><ul><li><b>A.</b> Raising the resamples to 200,000</li><li><b>B.</b> Reporting the 99% interval instead</li><li><b>C.</b> Collecting more tickets</li><li><b>D.</b> Resampling 45 tickets at a time</li></ul></li>
<li><p>A consultant reports "a 95% interval for the mean bill: 212 to 236 riyals". Which statement describes what the 95% refers to?</p><ul><li><b>A.</b> 95% of all customers of the company have a monthly bill somewhere between 212 and 236 riyals</li><li><b>B.</b> The interval was computed from 95% of the customers</li><li><b>C.</b> The method produces intervals that contain the true mean in about 95 of 100 studies</li><li><b>D.</b> The sample mean is 95% of the true mean</li></ul></li>
<li><p>To check an interval method, an analyst simulates 400 studies from a known population. In 368 of them the 95% interval contains the true value. What coverage did the method deliver?</p><ul><li><b>A.</b> 87%</li><li><b>B.</b> 92%</li><li><b>C.</b> 95%</li><li><b>D.</b> 97%</li></ul></li>
<li><p>Claim payments at an insurer are mostly small, but about one claim in 2,000 is larger than all the others in a typical month together. An analyst bootstraps the mean payment from 150 claims. What should a coverage check be expected to show?</p><ul><li><b>A.</b> Coverage near 95%, because the bootstrap needs no assumption about the shape of the data</li><li><b>B.</b> Coverage far below 95%, because most samples contain no very large claim</li><li><b>C.</b> Coverage above 95%, because the intervals are very wide</li><li><b>D.</b> Coverage of exactly 95%, because 150 is a large sample</li></ul></li>
<li><p>A study weighs 10 loaves from each of 30 bakeries chosen at random, 300 loaves in all, to estimate the mean weight of a loaf in the city. Which unit should a bootstrap resample?</p><ul><li><b>A.</b> The loaf</li><li><b>B.</b> The bakery, with its 10 loaves</li><li><b>C.</b> The weighing scale</li><li><b>D.</b> Half of the loaves of each bakery</li></ul></li>
<li><p>An analyst bootstraps rows of a two-stage survey (8 districts, 50 households each) and gets a 95% interval 0.3 points wide. A colleague resamples districts and gets 0.8 points. A simulation on a known population shows coverages of 61% and 93%. Which interval should be reported, and why?</p><ul><li><b>A.</b> The narrow one, because it is more precise</li><li><b>B.</b> The narrow one, because it uses all 400 rows and so wastes none of the information</li><li><b>C.</b> The wide one, because its method keeps the promise of 95% most nearly</li><li><b>D.</b> Neither, because the two methods disagree</li></ul></li>
<li><p>A file holds 600 satisfaction scores. Before bootstrapping, what does the analyst most need to find out?</p><ul><li><b>A.</b> Whether the scores are whole numbers</li><li><b>B.</b> How the 600 respondents were selected</li><li><b>C.</b> Which software collected the scores</li><li><b>D.</b> Whether the file is sorted by score</li></ul></li>
<li><p>Median delivery time is 40 minutes for courier X and 46 minutes for courier Y. A bootstrap gives a 95% interval for the ratio Y / X of 0.97 to 1.36. What can be said?</p><ul><li><b>A.</b> Y is slower by between 3% and 36%</li><li><b>B.</b> Y may be anywhere from 3% faster to 36% slower</li><li><b>C.</b> Y is slower by 15%, with certainty</li><li><b>D.</b> The two couriers are equally fast</li></ul></li>
<li><p>A study has 150 repairs by crew A and 90 by crew B. An analyst pools the 240 repairs, resamples 240 with replacement, splits them by crew label and takes the difference of medians. What is wrong with this bootstrap for the study as designed?</p><ul><li><b>A.</b> It draws with replacement, which a difference between two groups does not allow in any bootstrap</li><li><b>B.</b> It lets the number of repairs per crew change from resample to resample</li><li><b>C.</b> It uses medians, which cannot be bootstrapped</li><li><b>D.</b> It resamples too few repairs</li></ul></li>
<li><p>A dashboard shows a 95% interval for branch A, 6.1 to 7.4, and for branch B, 7.0 to 8.6. They overlap. A manager concludes that the branches do not differ. What is the sound next step?</p><ul><li><b>A.</b> Accept the conclusion, because overlapping intervals mean no difference</li><li><b>B.</b> Build the interval for the difference between the branches</li><li><b>C.</b> Widen both intervals to 99% and look again</li><li><b>D.</b> Compare the two lower ends only</li></ul></li>
<li><p>Zulal surveys customer satisfaction. To report on its 200 commercial customers it phones 100 of them, and it phones 300 of its 40,000 residential customers at random. Commercial customers score 5.0 on average in the sample, residential 7.0. What estimate of mean satisfaction over all 40,200 customers follows from the design?</p><ul><li><b>A.</b> 6.5, the mean of all 400 responses</li><li><b>B.</b> 6.0, the mean of the two group means</li><li><b>C.</b> 5.5, because the commercial customers were drawn more carefully and so count for more</li><li><b>D.</b> About 7.0, each group weighted by its N / n</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Tests</h2>
<ol>
<li><p>A survey phoned 50 households in each of 8 districts chosen at random. Bootstrapping the 400 rows gives a 95% interval of 6.5 to 6.8; bootstrapping the 8 districts gives 6.3 to 7.0. Which do you report, and why?</p><ul><li><b>A.</b> 6.5 to 6.8, because it is more precise</li><li><b>B.</b> 6.5 to 6.8, because it uses 400 observations and not 8</li><li><b>C.</b> 6.3 to 7.0, because districts were the unit drawn at random</li><li><b>D.</b> Something in between, to be safe</li></ul></li>
<li><p>A pilot gave 60 customers a new bill layout and 60 the old one, by lot. To test the difference in mean hold time, the analyst shuffles the 120 layout labels. What does each shuffle take for granted?</p><ul><li><b>A.</b> That the layout has no effect, so any 60 customers could carry the new label</li><li><b>B.</b> That the new layout shortens hold time for every customer</li><li><b>C.</b> That hold times follow a normal distribution</li><li><b>D.</b> That the 120 customers are replaced by new ones each time</li></ul></li>
<li><p>A trial of a new valve schedule in one district compares 40 days with it and 40 days without. Mean daily bursts fell from 3.1 to 2.8; p = 0.38. Which sentence may go in the report?</p><ul><li><b>A.</b> The schedule has no effect on bursts</li><li><b>B.</b> There is a 38% chance that the schedule does nothing</li><li><b>C.</b> The schedule cut bursts by 10%</li><li><b>D.</b> The trial does not show an effect; a fall of this size is common by chance at this sample size</li></ul></li>
<li><p>A bill redesign was compared on 60,000 customers before and 60,000 after. Mean time to pay fell by 0.2 days (95% interval 0.1 to 0.3; p &lt; 0.001). Finance says only a fall of 2 days or more matters. What is the right summary?</p><ul><li><b>A.</b> Highly significant: roll it out for the cash-flow benefit</li><li><b>B.</b> A real fall, far too small to matter: the whole interval is below 2 days</li><li><b>C.</b> No effect was found, since 0.2 days is negligible</li><li><b>D.</b> The study is inconclusive and needs a larger sample</li></ul></li>
<li><p>Zulal tests 40 pumping stations for abnormal energy use each month. A flagged station is shut for a two-day inspection that leaves its district on reduced pressure. Which rule should the plan name?</p><ul><li><b>A.</b> Flag every station with p below 0.05</li><li><b>B.</b> Benjamini-Hochberg at 5%</li><li><b>C.</b> Holm at 5%</li><li><b>D.</b> Test only the stations that look abnormal on the chart</li></ul></li>
<li><p>Two call scripts were given to callers at random. To test the difference in mean call length, an analyst shuffles the script labels 5,000 times. What question do the 5,000 shuffled differences answer?</p><ul><li><b>A.</b> How large a difference arises when the script has no effect</li><li><b>B.</b> How large the true effect of the new script on call length is in the population</li><li><b>C.</b> How long calls would be with a third script</li><li><b>D.</b> How many callers received the wrong script</li></ul></li>
<li><p>The observed difference in means is 1.8 minutes. Among 4,999 shuffles, 149 give a difference of 1.8 minutes or more in either direction. Counting the observed arrangement as one more shuffle, what is the two-sided p-value?</p><ul><li><b>A.</b> 0.003</li><li><b>B.</b> 0.015</li><li><b>C.</b> 0.030</li><li><b>D.</b> 0.300</li></ul></li>
<li><p>A pilot compares the 90th percentile of waiting time between two service desks, 25 customers each. No standard formula for this comparison is at hand. Which approach gives a valid p-value?</p><ul><li><b>A.</b> A t-test on the two means, with the result reported as a test of the 90th percentiles</li><li><b>B.</b> A comparison of the two bootstrap intervals by eye</li><li><b>C.</b> The larger of the two percentiles divided by the smaller</li><li><b>D.</b> A permutation test with the difference in 90th percentiles as its statistic</li></ul></li>
<li><p>A report states: "The new reminder letter reduced late payment (p = 0.02)." Which sentence says correctly what the 0.02 is?</p><ul><li><b>A.</b> There is a 2% chance that the letter has no effect and a 98% chance that it reduced late payment by some amount</li><li><b>B.</b> The letter reduced late payment by 2%</li><li><b>C.</b> If the letter had no effect, a reduction at least this large would appear in about 2 studies of 100</li><li><b>D.</b> In 2% of customers the letter did not work</li></ul></li>
<li><p>A trial with 18 pumps per group finds no significant difference in failures between two lubricants (p = 0.45). The maintenance lead writes: "The lubricants are equivalent." What is the weakness of that sentence?</p><ul><li><b>A.</b> A study this small would often give a large p-value even if one lubricant were clearly better</li><li><b>B.</b> A p-value of 0.45 means the lubricants differ in 45% of pumps</li><li><b>C.</b> The p-value should have been compared with 0.5, not 0.05</li><li><b>D.</b> Significance cannot be tested at all with fewer than 30 units per group, so the p-value is not valid</li></ul></li>
<li><p>A team screens 200 ideas for reducing leaks. Experience says about 10 of 200 really work. Each is tested at the 0.05 level with a study that detects a working idea 60% of the time. About how many of the "significant" ideas are false alarms?</p><ul><li><b>A.</b> About 5% of them</li><li><b>B.</b> About 20% of them</li><li><b>C.</b> About 40% of them</li><li><b>D.</b> About 60% of them</li></ul></li>
<li><p>A new routing rule changes mean travel time per repair by -6 minutes (95% interval -9 to -3). Operations say that a saving of at least 5 minutes pays for the rule. How should the result be reported?</p><ul><li><b>A.</b> A real saving; whether it reaches 5 minutes is not settled</li><li><b>B.</b> A real saving of more than 5 minutes</li><li><b>C.</b> No saving was shown</li><li><b>D.</b> A real saving that is too small to matter</li></ul></li>
<li><p>Satisfaction scores have a standard deviation of 2.0 points in both of two regions. The regions differ by 0.5 points in mean score. What is the standardised effect size d?</p><ul><li><b>A.</b> 0.10</li><li><b>B.</b> 0.20</li><li><b>C.</b> 0.25</li><li><b>D.</b> 4.00</li></ul></li>
<li><p>A simulation shows that a planned survey of 150 customers per group would detect a true gap of 0.3 points in 35% of studies. The survey is run and finds p = 0.21. What can be concluded about a gap of 0.3 points?</p><ul><li><b>A.</b> It is ruled out, because the result is not significant and the survey was planned with a simulation</li><li><b>B.</b> It is confirmed, because the power was low</li><li><b>C.</b> It is half as likely as before the survey</li><li><b>D.</b> It remains plausible, because the survey would have missed it about two times in three</li></ul></li>
<li><p>A dashboard tests 60 branches against the company average each month at the 0.05 level. In a month in which no branch truly differs, about how many branches will be flagged?</p><ul><li><b>A.</b> 3</li><li><b>B.</b> 0</li><li><b>C.</b> 6</li><li><b>D.</b> 12</li></ul></li>
<li><p>Five tests give the p-values 0.004, 0.011, 0.020, 0.030 and 0.400. Holm's method at 0.05 compares the smallest with 0.05/5, the next with 0.05/4, and so on, and stops at the first failure. How many hypotheses does it reject?</p><ul><li><b>A.</b> 1</li><li><b>B.</b> 2</li><li><b>C.</b> 4</li><li><b>D.</b> 5</li></ul></li>
<li><p>A league table ranks 40 clinics by the share of patients seen within the target time. The five best and the five worst are all among the smallest clinics. Before any clinic is praised or inspected, what is the most likely explanation to check?</p><ul><li><b>A.</b> Small clinics are managed either very well or very badly, with little in between, unlike large ones</li><li><b>B.</b> Small clinics report their data less carefully</li><li><b>C.</b> The target is unfair to clinics of middle size</li><li><b>D.</b> Shares based on few patients vary most, so small clinics land at both ends by chance</li></ul></li>
<li><p>An analyst compares two billing layouts on complaint rates and finds nothing. She then splits customers by region, by age band and by tariff, and reports the one split in which the layouts differ at p = 0.04. No correction is applied. What is the problem with the reported result?</p><ul><li><b>A.</b> It is the best of many looks, so its p-value overstates the evidence</li><li><b>B.</b> A p-value of 0.04 is too close to 0.05 to count</li><li><b>C.</b> Complaint rates cannot be compared between subgroups of customers of different size</li><li><b>D.</b> The subgroups were too large for a test</li></ul></li>
<li><p>A screening of 500 pipe segments flags candidates for a cheap follow-up inspection. The team can accept that about one flag in ten is a false alarm, and wants to miss as few faulty segments as possible. Which procedure fits that aim?</p><ul><li><b>A.</b> No correction at all, because the follow-up inspections are cheap and false alarms therefore cost little</li><li><b>B.</b> Holm at 0.05, because it is the strictest</li><li><b>C.</b> One test of all 500 segments together</li><li><b>D.</b> Benjamini-Hochberg at 10%, which limits the share of false alarms among the flags</li></ul></li>
<li><p>Ilyas ranks the 30 districts by a quarterly complaint rate and sends a support team to the five worst. Next quarter their rate falls by a third, and Nizar wants to roll the team out everywhere. Most of the five are small districts. What should Ilyas say first?</p><ul><li><b>A.</b> The fall is real, because it is large and happened in all five districts at once</li><li><b>B.</b> The team works only if a before-and-after test on the five gives p below 0.05</li><li><b>C.</b> Compare the five with the five best districts over the same quarter</li><li><b>D.</b> Part of the fall is expected anyway; compare with equally bad districts left out by lot</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Regression and reporting</h2>
<ol>
<li><p>A monthly report tests 20 service counters against the average at the 0.05 level and flags one. No correction is applied. What is the fair reading of the single flag?</p><ul><li><b>A.</b> It may well be a false alarm: 20 tests of counters that do not differ give one flag on average</li><li><b>B.</b> It has a 5% chance of being a false alarm</li><li><b>C.</b> The counter certainly differs from the others</li><li><b>D.</b> It must be ignored, since uncorrected tests mean nothing</li></ul></li>
<li><p>For 1,500 shops, monthly water use in cubic metres is regressed on floor area in square metres: use = 4.0 + 0.12 × area. The shops range from 20 to 400 square metres. Which statement is supported?</p><ul><li><b>A.</b> Extending a shop by 100 square metres will raise its use by 12 cubic metres</li><li><b>B.</b> A warehouse of 5,000 square metres uses about 604 cubic metres</li><li><b>C.</b> A shop with no floor area uses 4 cubic metres</li><li><b>D.</b> Among these shops, one that is 100 square metres larger uses about 12 cubic metres more on average</li></ul></li>
<li><p>A regression of monthly bill on meter size gives a slope of 41 riyals per size step. The library reports a standard error of 2.0; a bootstrap of customers gives 3.1. A plot shows bills scattering far more widely for large meters. What should the analyst report?</p><ul><li><b>A.</b> 2.0, because the library's formula is the standard method</li><li><b>B.</b> 3.1, because the spread is unequal and the bootstrap does not assume otherwise</li><li><b>C.</b> About 2.5, the middle of the two</li><li><b>D.</b> Neither: the slope cannot be trusted when spreads differ</li></ul></li>
<li><p>Across 900 branches, sales are regressed on the number of staff: 12,000 riyals per staff member. When the size of the branch's town is added, the slope on staff falls to 7,000. Which explanation fits?</p><ul><li><b>A.</b> The first slope was imprecise because the sample was too small</li><li><b>B.</b> Adding a variable always shrinks the other slopes</li><li><b>C.</b> Branches in larger towns have more staff and sell more for other reasons too</li><li><b>D.</b> The second model is wrong, since staff clearly drive sales</li></ul></li>
<li><p>A trial sent a reminder letter to 3,000 customers chosen by lot; 3,000 others got none. Which draft could a manager act on?</p><ul><li><b>A.</b> The letter worked: late payment differed significantly between the two groups of 3,000 (p = 0.004)</li><li><b>B.</b> Late payment was 2.1 points lower among the customers who got the letter than among the others</li><li><b>C.</b> We compared the groups with a permutation test and a bootstrap interval, both run with a fixed seed</li><li><b>D.</b> Late payment fell 2.1 points (95% interval 0.7 to 3.5; p = 0.004) among customers billed in March</li></ul></li>
<li><p>Electricity use of 800 flats is regressed on the number of rooms: use = 150 + 210 × rooms, in kilowatt-hours a month. A planner asks how much more a five-room flat uses than a three-room flat, on average. What does the line say?</p><ul><li><b>A.</b> 420 kilowatt-hours a month more</li><li><b>B.</b> 210 kilowatt-hours a month more</li><li><b>C.</b> 570 kilowatt-hours a month more</li><li><b>D.</b> 1,200 kilowatt-hours a month more</li></ul></li>
<li><p>Fuel use of delivery vans is regressed on the load carried, for loads between 200 and 900 kilograms: litres per 100 km = 7.5 + 0.004 × load. A colleague uses the line to budget fuel for a lorry carrying 12,000 kilograms. What is the main objection?</p><ul><li><b>A.</b> The slope has no units and cannot be multiplied by a load</li><li><b>B.</b> The intercept of 7.5 shows that the line is biased</li><li><b>C.</b> The load is far outside the range the line was fitted on, where nothing shows the relation still holds</li><li><b>D.</b> A fitted line can be used only to describe the vans it was fitted on and never to predict the fuel use of any vehicle</li></ul></li>
<li><p>A survey of 3,000 employees finds that each additional training day taken last year goes with 1.8 more points on the performance review. A report concludes: "Sending an employee on one more training day will raise the review by 1.8 points." Which objection is the strongest?</p><ul><li><b>A.</b> The sample of 3,000 is too small for a slope</li><li><b>B.</b> A slope cannot be estimated for a count such as days</li><li><b>C.</b> The slope should have been reported per hour of training and not per day, since days differ in length</li><li><b>D.</b> Employees who take more training may differ in other ways that also raise reviews</li></ul></li>
<li><p>Two analysts each draw 500 customers at random from the same billing system and regress bill on consumption. One finds a slope of 2.31 riyals per cubic metre, the other 2.42. Neither made an error. What explains the two values?</p><ul><li><b>A.</b> A slope computed from a sample varies from sample to sample, like a mean</li><li><b>B.</b> The tariff changed between the two draws</li><li><b>C.</b> One of the two used the wrong formula</li><li><b>D.</b> Least squares gives a different answer each time it runs on the same data</li></ul></li>
<li><p>To bootstrap the slope of salary on years of experience for 600 employees, an analyst resamples the experience column and the salary column separately, each with replacement. The bootstrap slopes come out close to zero. Why?</p><ul><li><b>A.</b> Too few resamples were drawn</li><li><b>B.</b> Salaries are skewed, which a bootstrap cannot handle</li><li><b>C.</b> Separate resampling breaks the link between each employee's two values</li><li><b>D.</b> The slope of the original sample was itself close to zero</li></ul></li>
<li><p>In a regression of monthly sales on shop floor area, the residuals scatter within about 5,000 riyals for small shops and within about 40,000 riyals for large ones. What does this do to the output of the default formula?</p><ul><li><b>A.</b> It biases the slope upward</li><li><b>B.</b> It makes the reported R² meaningless as a description of the fit</li><li><b>C.</b> It makes the reported p-value too large</li><li><b>D.</b> It makes the reported standard error of the slope too small</li></ul></li>
<li><p>On a known population, an analyst draws 400 samples and builds two 95% intervals for a slope in each. The formula interval contains the true slope in 352 samples, the bootstrap interval in 381. What do the counts show?</p><ul><li><b>A.</b> Coverage of 88% and 95%: the bootstrap interval keeps the promise and the formula interval does not</li><li><b>B.</b> Coverage of 95% for both, since both are 95% intervals</li><li><b>C.</b> Coverage of 12% and 5%: both intervals fail</li><li><b>D.</b> Coverage cannot be judged from 400 samples, since a count from so few samples is itself too uncertain to compare</li></ul></li>
<li><p>A regression table shows for the variable "distance_km": coefficient 0.85, standard error 0.10, p &lt; 0.001. The outcome is delivery time in minutes. Which sentence reports the result best?</p><ul><li><b>A.</b> Distance is a highly significant predictor of delivery time (p &lt; 0.001), so the routing model is confirmed</li><li><b>B.</b> The coefficient of distance is 0.85 with a standard error of 0.10</li><li><b>C.</b> Each additional kilometre goes with about 0.85 minutes more (95% interval about 0.65 to 1.05)</li><li><b>D.</b> Distance explains 85% of delivery time</li></ul></li>
<li><p>Hospital stay in days is regressed on the number of medicines prescribed: 0.9 days per medicine. When the severity of the illness is added to the model, the slope on medicines falls to 0.2. What is the most likely reason?</p><ul><li><b>A.</b> Severely ill patients get more medicines and also stay longer for other reasons</li><li><b>B.</b> The first model had too few patients</li><li><b>C.</b> Adding any second variable to a regression model always lowers the slopes of the variables already in it</li><li><b>D.</b> Severity was measured with error</li></ul></li>
<li><p>After regressing energy use of buildings on floor area, an analyst plots the residuals against the age of the building, a variable that is not in the model. The residuals rise steadily with age. What does the plot indicate?</p><ul><li><b>A.</b> The slope on floor area is too large to be real</li><li><b>B.</b> Age should be removed from the dataset</li><li><b>C.</b> Age carries systematic information about energy use that the model is missing</li><li><b>D.</b> The residuals were computed wrongly, since they should always average zero</li></ul></li>
<li><p>A model of water use gives 98 litres per person with household size alone, and 86 litres per person once area temperature is included. A planner sizes the supply for one new scheme, in one area, for families of different sizes. Which figure fits her question?</p><ul><li><b>A.</b> 98, because it comes from the simpler model</li><li><b>B.</b> 92, the average of the two</li><li><b>C.</b> Neither, because the two models contradict each other</li><li><b>D.</b> 86, because within one area the temperature does not change</li></ul></li>
<li><p>After adding three more variables, an analyst writes: "All confounders are now controlled, so the slope is the causal effect." What is the weakness of the sentence?</p><ul><li><b>A.</b> Three variables are too many for one model</li><li><b>B.</b> A slope is never related to a cause</li><li><b>C.</b> Controlling for more variables always makes a slope less precise, so the estimate has lost its value as evidence</li><li><b>D.</b> Only the measured variables were adjusted for; one that nobody measured may still be mixed in</li></ul></li>
<li><p>A manager asks: "Are customers happier with the new app?" Which line turns the question into an estimand?</p><ul><li><b>A.</b> The difference in mean satisfaction score between app users and other customers surveyed this quarter</li><li><b>B.</b> A permutation test with 5,000 shuffles</li><li><b>C.</b> Whether the app is good</li><li><b>D.</b> The satisfaction scores of all customers in the survey file for this quarter, with a column that marks the app users</li></ul></li>
<li><p>An analyst must put an interval on the share of 350 sampled invoices that were paid late, and has only the bootstrap code written for a mean. What is the sound way forward?</p><ul><li><b>A.</b> Wait for a method specific to shares</li><li><b>B.</b> Bootstrap the median payment delay instead</li><li><b>C.</b> Code each invoice 1 if late and 0 if not, and bootstrap the mean of that column</li><li><b>D.</b> Report the share with no interval, since shares are exact</li></ul></li>
<li><p>Four closing sentences are proposed for a brief on repair times drawn from one year of logged tickets. Which one states a limit a manager can use?</p><ul><li><b>A.</b> These results rest on a sample and on logged data, and they should therefore be interpreted with a suitable degree of caution</li><li><b>B.</b> More research is needed</li><li><b>C.</b> Statistics can never prove anything</li><li><b>D.</b> Tickets closed late in the system count as slow repairs, so the true share within the standard may be higher</li></ul></li>
<li><p>A draft reads: "Mean resolution time fell from 31 to 27 hours after the new rule (p = 0.03), so the rule works." The data are complaints from the month before and the month after the change. What must be added before a manager acts on it?</p><ul><li><b>A.</b> An interval for the 4-hour change, and the limit that the two months may differ for other reasons</li><li><b>B.</b> A second p-value from another test, such as a classical test, to confirm that the first one was computed correctly</li><li><b>C.</b> More decimal places for the two means</li><li><b>D.</b> The number of resamples used</li></ul></li>
<li><p>A meter-fault flag is checked on 200 faulty meters and 200 sound ones: it flags 180 faulty and 20 sound, a precision of 90% on the set. In the region 2% of meters are faulty. What share of flagged meters will be faulty in the field?</p><ul><li><b>A.</b> 90%, the precision measured on the balanced set of 400 meters</li><li><b>B.</b> 50%, the share of faulty meters among the 400 that were checked</li><li><b>C.</b> About 16%, once each class is weighted back</li><li><b>D.</b> 2%, the share of faulty meters in the region as a whole</li></ul></li>
</ol>

ceptions":["Takes the spread of the means for the spread of households: single households range far wider, from 30 to over 1,500 litres","Reads sampling variation as a real change: the population mean can stay at 470 while samples of 50 move by about 30 litres","","Treats variation between samples as a fault: every correctly drawn sample of 50 misses by a different amount"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-sampling-distribution","title":"Which sentence describes a sampling distribution?"},"level":null,"pool":"checkpoint"},{"id":"check-sd-or-se-q1","type":"single","prompt":"From 400 households: mean 468 litres, standard deviation 204, standard error 10. Jamila asks: \"How sure are we about the 468?\" Which reply is right?","options":[{"key":"A","text":"The true average is very likely within about 20 litres of 468"},{"key":"B","text":"The true average could be anywhere within 204 litres of 468"},{"key":"C","text":"Nearly all households use between 448 and 488 litres"},{"key":"D","text":"With 400 households the 468 is exact"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Her question is about the estimate, so the standard error answers it: 468 give or take about 2 × 10 litres.","misconceptions":["","Uses the standard deviation, which describes how households differ, to describe the precision of the average","Applies the standard error to single households: most households are far more than 20 litres from 468","Assumes a large sample removes uncertainty: 400 households give an error of about 10 litres, not zero"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-sd-or-se","title":"Which number answers the manager?"},"level":null,"pool":"checkpoint"},{"id":"check-which-summary-q1","type":"single","prompt":"The contract promises customers that \"a typical leak is repaired within 8 hours\". This month: mean 15.3 hours, median 6.5 hours, one ticket of 1,450 hours. What should Nizar report against the promise?","options":[{"key":"A","text":"The mean, 15.3 hours: the promise was broken"},{"key":"B","text":"The mean after deleting the long ticket, with no note"},{"key":"C","text":"The midpoint of mean and median, 10.9 hours"},{"key":"D","text":"The median, 6.5 hours, and the long ticket named separately"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"\"Typical\" is a question about the middle ticket. The long ticket is a fact about the ticketing process and is reported as one.","misconceptions":["Lets one unclosed ticket stand for the typical repair: 199 of 200 repairs did not change","Removes a record without saying so: the reader can no longer check the number or learn about the ticketing fault","Hides the choice from the reader: an average of two summaries answers neither question",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-which-summary","title":"Which summary goes in the monthly report?"},"level":null,"pool":"checkpoint"},{"id":"check-honest-description-q1","type":"single","prompt":"Four drafts describe the same 300 repairs, one of which is a late-entry ticket of 663.5 hours. Which one can a reader check and rely on?","options":[{"key":"A","text":"Repairs took 10.4 ± 38.4 hours on average"},{"key":"B","text":"Of 300 sampled repairs the median was 6.2 hours (quartiles 3.7 and 10.4); one late-entry ticket is listed apart"},{"key":"C","text":"Repairs typically take about six hours"},{"key":"D","text":"All of Zulal's repairs have a median of exactly 6.2 hours"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Count, middle, spread and the exclusion are all there, and nothing is claimed beyond the 300.","misconceptions":["Uses mean and SD on skewed data: the range starts below zero hours and is driven by one ticket","","Gives a number with no count, no spread and no population: the reader cannot judge how much it rests on","States a sample result as a fact about every repair: a description of 300 tickets says nothing certain about all 12,000"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-honest-description","title":"Which description would you sign?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"From 100 households: mean 490 litres, standard deviation 200, standard error 20. Zulal reads 400 households next time. What do you expect?","options":[{"key":"A","text":"Standard deviation about 100, standard error about 20"},{"key":"B","text":"Standard deviation about 200, standard error about 10"},{"key":"C","text":"Standard deviation about 200, standard error about 5"},{"key":"D","text":"Standard deviation about 100, standard error about 10"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Households differ as much as ever. Four times the sample halves the standard error: 200 / √400 = 10.","misconceptions":["Lets the spread of households shrink with the sample: households differ as much as before","","Divides the standard error by 4 and not by the square root of 4","Shrinks both: only the precision of the estimate improves with more data"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which number shrinks when you read more meters?"},"level":null,"pool":"checkpoint"},{"id":"check-resample-q1","type":"single","prompt":"You have 80 survey scores and want an interval for their median. Which step, repeated 2,000 times, gives the bootstrap distribution?","options":[{"key":"A","text":"Shuffle the 80 scores and take their median"},{"key":"B","text":"Draw 40 of the 80 scores at random and take their median"},{"key":"C","text":"Draw 80 new scores from all customers and take their median"},{"key":"D","text":"Draw 80 scores from the 80 with replacement and take their median"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Same size as the sample, from the sample, with replacement: that imitates drawing a new sample of 80 from the population.","misconceptions":["Draws without replacement: 80 from 80 returns the same sample each time and the median never moves","Changes the sample size: the spread of a median of 40 is wider than that of a median of 80","Goes back to the population, which a real analyst does not have",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-resample","title":"Which procedure is a bootstrap resample?"},"level":null,"pool":"checkpoint"},{"id":"check-reading-95-q1","type":"single","prompt":"From 150 repairs Ilyas computes a 95% interval for the median repair time: 5.0 to 7.5 hours. Which sentence is correct?","options":[{"key":"A","text":"The method that gave this interval catches the true median in about 95 of 100 studies"},{"key":"B","text":"About 95% of repairs take between 5.0 and 7.5 hours"},{"key":"C","text":"The true median has a 95% chance of lying between 5.0 and 7.5 hours"},{"key":"D","text":"In 95% of future samples the median will be between 5.0 and 7.5 hours"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Coverage belongs to the method over repeated studies. And as lab 2.2 shows, even that figure has to be earned by the data.","misconceptions":["","Reads the interval for a median as a range for single repairs, which spread far wider","Puts the probability on the fixed true value: this one interval contains it or does not","Treats sample medians as if they would fall inside this one interval: other samples have other intervals"],"lo":["LO1"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-reading-95","title":"What may Ilyas write about his interval?"},"level":null,"pool":"checkpoint"},{"id":"check-unit-q1","type":"single","prompt":"To estimate mean water pressure, Zulal picks 25 streets at random and measures the pressure at 8 houses on each: 200 readings. Which bootstrap gives an honest interval for the mean?","options":[{"key":"A","text":"Resample the 200 readings"},{"key":"B","text":"Resample 8 readings within each street"},{"key":"C","text":"Resample the 25 streets, each with its 8 readings"},{"key":"D","text":"Resample 100 of the 200 readings"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The street was drawn at random and houses on a street move together, so the street is the unit.","misconceptions":["Treats 200 readings as independent although houses on one street share a main: the interval comes out too narrow","Keeps every street in every resample, so the variation between streets, the largest part, is never imitated","","Changes the amount of data in each resample, which changes the spread being estimated"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-unit","title":"What is the unit to resample?"},"level":null,"pool":"checkpoint"},{"id":"check-ratio-q1","type":"single","prompt":"A study compares the median time to answer a call at two desks. Ratio North / South: 1.30, 95% interval 1.08 to 1.57. What may the analyst report?","options":[{"key":"A","text":"No gap is shown, because the interval does not include 0"},{"key":"B","text":"North is slower: between 8% and 57% longer than South"},{"key":"C","text":"North is slower by exactly 30%"},{"key":"D","text":"North takes between 1.08 and 1.57 hours longer than South"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval lies wholly above 1, the value of no gap for a ratio, and its ends give the range in percent.","misconceptions":["Reads a ratio interval against 0: for a ratio, no gap is 1, and the interval can never include 0","","Reads the estimate as exact and drops the interval that says how uncertain it is","Turns a ratio into a difference in hours without knowing either median"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-ratio","title":"How do you read this ratio interval?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A survey phoned 50 households in each of 8 districts chosen at random. Bootstrapping the 400 rows gives a 95% interval of 6.5 to 6.8; bootstrapping the 8 districts gives 6.3 to 7.0. Which do you report, and why?","options":[{"key":"A","text":"6.5 to 6.8, because it is more precise"},{"key":"B","text":"6.5 to 6.8, because it uses 400 observations and not 8"},{"key":"C","text":"6.3 to 7.0, because districts were the unit drawn at random"},{"key":"D","text":"Something in between, to be safe"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Resample the unit that was sampled. In lab 2.3 the row bootstrap covered the truth in 72% of surveys, the district bootstrap in 94%.","misconceptions":["Prefers the narrow interval for its look: it ignores that another survey would visit other districts","Counts rows as the amount of information although households of one district resemble each other","","Averages two methods of which one does not match how the data were collected"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which interval would you report?"},"level":null,"pool":"checkpoint"},{"id":"check-shuffle-q1","type":"single","prompt":"A pilot gave 60 customers a new bill layout and 60 the old one, by lot. To test the difference in mean hold time, the analyst shuffles the 120 layout labels. What does each shuffle take for granted?","options":[{"key":"A","text":"That the layout has no effect, so any 60 customers could carry the new label"},{"key":"B","text":"That the new layout shortens hold time for every customer"},{"key":"C","text":"That hold times follow a normal distribution"},{"key":"D","text":"That the 120 customers are replaced by new ones each time"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"If the label does not matter, every assignment of it is as likely as the real one.","misconceptions":["","States the hypothesis the analyst hopes to support, which the shuffle is built to contradict","Adds a bell-curve assumption that the permutation test does not need","Confuses shuffling labels with resampling customers: the same 120 hold times are used in every shuffle"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-shuffle","title":"What does one shuffle assume?"},"level":null,"pool":"checkpoint"},{"id":"check-misreading-q1","type":"single","prompt":"A trial of a new valve schedule in one district compares 40 days with it and 40 days without. Mean daily bursts fell from 3.1 to 2.8; p = 0.38. Which sentence may go in the report?","options":[{"key":"A","text":"The schedule has no effect on bursts"},{"key":"B","text":"There is a 38% chance that the schedule does nothing"},{"key":"C","text":"The schedule cut bursts by 10%"},{"key":"D","text":"The trial does not show an effect; a fall of this size is common by chance at this sample size"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A large p-value says the data are compatible with no effect. It does not say the effect is zero; the interval shows what remains possible.","misconceptions":["Reads a large p-value as proof of no effect: 40 days per group may be too few to see a real fall","Reads the p-value as the probability of the null hypothesis","Treats the observed fall as established although such a fall is common when nothing changed",""],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-misreading","title":"Which reading of the result is sound?"},"level":null,"pool":"checkpoint"},{"id":"check-significant-important-q1","type":"single","prompt":"A bill redesign was compared on 60,000 customers before and 60,000 after. Mean time to pay fell by 0.2 days (95% interval 0.1 to 0.3; p \u003c 0.001). Finance says only a fall of 2 days or more matters. What is the right summary?","options":[{"key":"A","text":"Highly significant: roll it out for the cash-flow benefit"},{"key":"B","text":"A real fall, far too small to matter: the whole interval is below 2 days"},{"key":"C","text":"No effect was found, since 0.2 days is negligible"},{"key":"D","text":"The study is inconclusive and needs a larger sample"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval excludes 0 and lies wholly below the threshold.","misconceptions":["Takes a tiny p-value for a large effect: with 120,000 customers even 0.2 days is detected","","Reads 'too small to matter' as 'not real': the interval excludes zero","Asks for more data although the interval already lies wholly below the threshold"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-significant-important","title":"What do you tell the manager?"},"level":null,"pool":"checkpoint"},{"id":"check-correction-q1","type":"single","prompt":"Zulal tests 40 pumping stations for abnormal energy use each month. A flagged station is shut for a two-day inspection that leaves its district on reduced pressure. Which rule should the plan name?","options":[{"key":"A","text":"Flag every station with p below 0.05"},{"key":"B","text":"Benjamini-Hochberg at 5%"},{"key":"C","text":"Holm at 5%"},{"key":"D","text":"Test only the stations that look abnormal on the chart"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A false flag here is costly for a whole district, so the chance of even one per month should stay small: family-wise control.","misconceptions":["Accepts about two false shutdowns a month: 40 tests at 5% with nothing wrong","Controls the share of false flags, which still lets a false shutdown through in many months","","Chooses the tests after seeing the data, which is the forking-paths problem in its plainest form"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-correction","title":"Which correction fits the audit?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A monthly report tests 20 service counters against the average at the 0.05 level and flags one. No correction is applied. What is the fair reading of the single flag?","options":[{"key":"A","text":"It may well be a false alarm: 20 tests of counters that do not differ give one flag on average"},{"key":"B","text":"It has a 5% chance of being a false alarm"},{"key":"C","text":"The counter certainly differs from the others"},{"key":"D","text":"It must be ignored, since uncorrected tests mean nothing"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"20 × 0.05 = 1 false flag expected when nothing differs. One flag in twenty is what chance alone delivers.","misconceptions":["","Applies the error rate of one planned test to the best of twenty","Reads a p-value below 0.05 as proof, whatever the number of tests","Dismisses the result outright: a flag after correction, or a second look, could still be real"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"How many of these flags can you trust?"},"level":null,"pool":"checkpoint"},{"id":"check-reading-slope-q1","type":"single","prompt":"For 1,500 shops, monthly water use in cubic metres is regressed on floor area in square metres: use = 4.0 + 0.12 × area. The shops range from 20 to 400 square metres. Which statement is supported?","options":[{"key":"A","text":"Extending a shop by 100 square metres will raise its use by 12 cubic metres"},{"key":"B","text":"A warehouse of 5,000 square metres uses about 604 cubic metres"},{"key":"C","text":"A shop with no floor area uses 4 cubic metres"},{"key":"D","text":"Among these shops, one that is 100 square metres larger uses about 12 cubic metres more on average"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The slope compares shops of different sizes within the range observed: 0.12 × 100 = 12 cubic metres.","misconceptions":["Reads a comparison between shops as the effect of changing one shop","Extrapolates far beyond the largest shop observed","Reads the intercept as a measurement: no shop has zero floor area",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-reading-slope","title":"What does this slope tell the planner?"},"level":null,"pool":"checkpoint"},{"id":"check-which-se-q1","type":"single","prompt":"A regression of monthly bill on meter size gives a slope of 41 riyals per size step. The library reports a standard error of 2.0; a bootstrap of customers gives 3.1. A plot shows bills scattering far more widely for large meters. What should the analyst report?","options":[{"key":"A","text":"2.0, because the library's formula is the standard method"},{"key":"B","text":"3.1, because the spread is unequal and the bootstrap does not assume otherwise"},{"key":"C","text":"About 2.5, the middle of the two"},{"key":"D","text":"Neither: the slope cannot be trusted when spreads differ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Unequal spread does not bias the slope; it makes the default standard error too small. The bootstrap, or a robust standard error, is the honest one.","misconceptions":["Chooses the smaller error because it looks better, although its assumption of equal spread visibly fails","","Averages a valid and an invalid figure","Gives up the estimate although a valid standard error is at hand"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-which-se","title":"Which standard error goes in the brief?"},"level":null,"pool":"checkpoint"},{"id":"check-why-slope-moves-q1","type":"single","prompt":"Across 900 branches, sales are regressed on the number of staff: 12,000 riyals per staff member. When the size of the branch's town is added, the slope on staff falls to 7,000. Which explanation fits?","options":[{"key":"A","text":"The first slope was imprecise because the sample was too small"},{"key":"B","text":"Adding a variable always shrinks the other slopes"},{"key":"C","text":"Branches in larger towns have more staff and sell more for other reasons too"},{"key":"D","text":"The second model is wrong, since staff clearly drive sales"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Town size is tied to both staff and sales. Left out, its share of the sales was credited to staff.","misconceptions":["Blames sampling error for a move that comes from changing the question; an interval around 12,000 would not have covered it","Assumes that adding any variable weakens the others: a variable unrelated to staff would leave the slope where it was","","Reads the smaller slope as an error in the second model, which is the one that separates the two influences"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-why-slope-moves","title":"Why did the slope move?"},"level":null,"pool":"checkpoint"},{"id":"check-brief-q1","type":"single","prompt":"A trial sent a reminder letter to 3,000 customers chosen by lot; 3,000 others got none. Which draft could a manager act on?","options":[{"key":"A","text":"The letter worked: late payment differed significantly between the two groups of 3,000 (p = 0.004)"},{"key":"B","text":"Late payment was 2.1 points lower among the customers who got the letter than among the others"},{"key":"C","text":"We compared the groups with a permutation test and a bootstrap interval, both run with a fixed seed"},{"key":"D","text":"Late payment fell 2.1 points (95% interval 0.7 to 3.5; p = 0.004) among customers billed in March"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Estimate, interval, test and population are all there, to set against the cost of the letter.","misconceptions":["Gives a test result with no size: the manager cannot tell a large effect from a negligible one","Gives an estimate with no uncertainty and no statement of who it applies to","Lists methods and leaves out every result",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-brief","title":"Which draft is an inference brief?"},"level":null,"pool":"checkpoint"},{"id":"q-sampling-01","type":"single","prompt":"A utility has 60,000 customers. An analyst phones 80 of them and finds that 35% would pay bills through an app. Which of these is the statistic?","options":[{"key":"A","text":"The share of all 60,000 customers who would pay by app"},{"key":"B","text":"The 35% found among the 80 customers phoned"},{"key":"C","text":"The 80 customers who were phoned"},{"key":"D","text":"The 60,000 customers of the utility"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A statistic is a number computed from the sample: the 35% among the 80. The share among all 60,000 is the parameter it estimates.","misconceptions":["Names the parameter: the number that describes the whole population","","Names the sample, which is a set of units, not a number","Names the population, which is a set of units, not a number"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"four-words","title":"Four words separate what is true from what you saw"},"level":"understand","pool":"practice"},{"id":"q-sampling-02","type":"single","prompt":"An analyst draws 500 samples of 40 households and plots a histogram of the 500 sample means. What does one bar of this histogram count?","options":[{"key":"A","text":"Households whose consumption falls in that range"},{"key":"B","text":"Litres consumed by the households in that range"},{"key":"C","text":"Samples whose mean falls in that range"},{"key":"D","text":"Households that appear in more than one sample"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The histogram is a sampling distribution: each of its 500 entries is the mean of one sample.","misconceptions":["Reads the sampling distribution as the distribution of households","Confuses the count on the vertical axis with the quantity on the horizontal axis","","Invents a quantity the histogram does not show"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"sampling-distribution","title":"Do it 1,000 times and the misses form a distribution"},"level":"understand","pool":"practice"},{"id":"q-sampling-03","type":"single","prompt":"Two analysts each read 60 meters drawn at random from the same population, on the same day. One reports a mean of 452 litres, the other 489 litres. Both followed the method correctly. What explains the gap best?","options":[{"key":"A","text":"Each sample is one draw of many, and means of 60 vary from draw to draw"},{"key":"B","text":"One of the two samples must contain a recording error"},{"key":"C","text":"The population mean must have changed in the time between the first sample and the second"},{"key":"D","text":"Samples of 60 are too small to give any usable mean"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two correctly drawn samples of 60 give two different means: the gap is ordinary sampling variation.","misconceptions":["","Treats sampling variation as a fault that needs a culprit","Reads a difference between samples as a change in the population","Overstates the problem: the mean is usable once its standard error is given"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"one-sample-misses","title":"One sample of 50 lands near the truth, never on it"},"level":"analyze","pool":"practice"},{"id":"q-se-01","type":"single","prompt":"A sample of 225 households has a mean consumption of 480 litres and a standard deviation of 180 litres. What is the estimated standard error of the mean?","options":[{"key":"A","text":"0.8 litres"},{"key":"B","text":"12 litres"},{"key":"C","text":"32 litres"},{"key":"D","text":"180 litres"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"s / √n = 180 / 15 = 12 litres.","misconceptions":["Divides the standard deviation by n and not by its square root","","Divides the mean by the square root of n","Gives the standard deviation of households, which is not the error of the mean"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"se-by-formula","title":"By formula: the spread of households divided by √n"},"level":"apply","pool":"practice"},{"id":"q-se-02","type":"single","prompt":"With 100 households the standard error of mean consumption is 20 litres. The manager wants a standard error of 5 litres. About how many households are needed?","options":[{"key":"A","text":"200 households"},{"key":"B","text":"400 households"},{"key":"C","text":"800 households"},{"key":"D","text":"1,600 households"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The error must fall 4 times, which costs 4² = 16 times the sample: 1,600 households.","misconceptions":["Assumes the error halves each time the sample doubles","Assumes the error falls in proportion to the sample","Doubles twice more than a proportional rule without squaring",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"sqrt-law-samples","title":"Half the error costs four times the sample"},"level":"apply","pool":"practice"},{"id":"q-se-03","type":"single","prompt":"A report on 900 households says: \"Mean consumption 465 litres (SD 210, SE 7)\". A planner needs to know how much a single household can differ from the average. Which number answers the planner?","options":[{"key":"A","text":"The SD, 210 litres"},{"key":"B","text":"The SE, 7 litres"},{"key":"C","text":"Twice the SE, 14 litres"},{"key":"D","text":"The mean, 465 litres"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"How far single households lie from the average is the standard deviation. The standard error describes the precision of the mean.","misconceptions":["","Applies the precision of the mean to single households","Builds an interval for the mean, which still says nothing about single households","Gives the centre, not the spread"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"sd-versus-se","title":"The standard deviation describes households; the standard error describes your estimate"},"level":"analyze","pool":"practice"},{"id":"q-skew-01","type":"single","prompt":"Complaint resolution times at a call centre have a median of 4 hours and a mean of 9 hours. What does that pair of numbers tell you about the distribution?","options":[{"key":"A","text":"It is symmetric around 6.5 hours"},{"key":"B","text":"It has a long tail of short resolutions"},{"key":"C","text":"It has a long tail of long resolutions"},{"key":"D","text":"It contains a calculation error"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A mean well above the median is the mark of a long right tail: a few very long resolutions pull the mean up.","misconceptions":["Averages the two summaries as if neither were informative","Reverses the direction: a tail of small values would pull the mean below the median","","Assumes mean and median must agree"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"mean-follows-tail","title":"The mean is a balance point; the median is the middle ticket"},"level":"understand","pool":"practice"},{"id":"q-skew-02","type":"single","prompt":"A sample of 99 repairs has a mean of 8.0 hours and a median of 6.0 hours. One more ticket of 808 hours is added. What happens to the two summaries, approximately?","options":[{"key":"A","text":"Mean 8.1 hours, median 14 hours"},{"key":"B","text":"Mean 16 hours, median 6 hours"},{"key":"C","text":"Mean 16 hours, median 14 hours"},{"key":"D","text":"Mean 8.1 hours, median 6 hours"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The new mean is (99 × 8 + 808) / 100 = 16 hours. The median only moves to a neighbouring ticket, so it stays near 6.","misconceptions":["Swaps the behaviour of the two summaries","","Lets the extreme value move the median as much as the mean","Assumes one value in a hundred cannot matter"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"one-open-ticket","title":"One ticket left open for two months nearly doubles the mean"},"level":"apply","pool":"practice"},{"id":"q-skew-03","type":"single","prompt":"The finance team asks how many crew hours were paid for 3,000 repairs last quarter. The repair times are strongly skewed. Which summary should the analyst multiply by 3,000?","options":[{"key":"A","text":"The median repair time"},{"key":"B","text":"The trimmed mean repair time"},{"key":"C","text":"The mean repair time"},{"key":"D","text":"The most frequent repair time"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A total equals the mean times the count, whatever the shape of the distribution. The median times the count would understate the hours.","misconceptions":["Uses the typical repair where a total is asked for","Drops the long repairs, whose hours were paid all the same","","Uses the peak of the histogram, which ignores the tail entirely"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"which-summary","title":"The question decides the summary"},"level":"evaluate","pool":"practice"},{"id":"q-describe-01","type":"single","prompt":"A sample of waiting times has first quartile 12 minutes, median 20 minutes and third quartile 34 minutes. What is the interquartile range?","options":[{"key":"A","text":"8 minutes"},{"key":"B","text":"14 minutes"},{"key":"C","text":"20 minutes"},{"key":"D","text":"22 minutes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The interquartile range is the third quartile minus the first: 34 - 12 = 22 minutes.","misconceptions":["Takes the median minus the first quartile","Takes the third quartile minus the median","Gives the median itself",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"five-numbers","title":"Five numbers describe a skewed sample without pretending it is a bell"},"level":"apply","pool":"practice"},{"id":"q-describe-02","type":"single","prompt":"An analyst summarises 250 skewed repair times, three of which are tickets closed weeks late. Which sentence gives a reader what is needed to rely on the summary?","options":[{"key":"A","text":"Repairs took 11 hours on average, give or take 40"},{"key":"B","text":"Of 250 sampled repairs the median was 6 hours and the quartiles 4 and 10; 3 late tickets are listed apart"},{"key":"C","text":"The typical repair at the utility takes 6 hours"},{"key":"D","text":"After cleaning, the mean repair time was 7 hours"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It gives the count, the middle, the spread and the exclusion, and claims nothing beyond the sample.","misconceptions":["Uses mean and standard deviation on skewed data, with a range that goes below zero","","Gives no count, no spread and states a sample result as a fact about all repairs","Hides what \"cleaning\" removed, so the number cannot be checked"],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"honest-description","title":"An honest description can be checked line by line"},"level":"evaluate","pool":"practice"},{"id":"q-describe-03","type":"single","prompt":"A table of median repair time by district is built from a sample of 300 repairs. District D30 has 4 repairs in the sample and the highest median of all. What should the analyst do with that row?","options":[{"key":"A","text":"Report it as the worst district"},{"key":"B","text":"Withhold the number and state that the count is too small"},{"key":"C","text":"Replace it with the overall median"},{"key":"D","text":"Delete the district from the table without a note"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A median of 4 tickets is unstable and, in a small district, can point at single households. The row is withheld with the reason stated.","misconceptions":["Ranks on a number that four tickets cannot support","","Invents a value the data did not give","Removes the row in silence, so the reader cannot tell it was ever there"],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"small-counts","title":"By district only, and not when the count is small"},"level":"analyze","pool":"practice"},{"id":"q-bootstrap-01","type":"single","prompt":"An analyst has 120 call durations and bootstraps their median. Why is each resample drawn with replacement?","options":[{"key":"A","text":"So that resamples differ from one another the way real samples would"},{"key":"B","text":"So that each resample is larger than the original sample"},{"key":"C","text":"So that extreme durations are removed from the resamples"},{"key":"D","text":"So that every one of the 120 durations appears exactly once in each resample"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Drawing 120 from 120 without replacement returns the same sample every time. Replacement makes the resamples vary, which imitates sampling from the population.","misconceptions":["","Confuses replacement with a change of size: a resample has the size of the sample","Believes the bootstrap cleans the data; it reuses every value as it is","Describes sampling without replacement, which gives identical resamples"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"bootstrap-idea","title":"Treat the sample as the population and sample from it"},"level":"understand","pool":"practice"},{"id":"q-bootstrap-02","type":"single","prompt":"From 1,000 bootstrap medians, sorted from smallest to largest, an analyst wants the 90% percentile interval. Which two sorted values are its ends?","options":[{"key":"A","text":"The 25th and the 975th"},{"key":"B","text":"The 50th and the 950th"},{"key":"C","text":"The 100th and the 900th"},{"key":"D","text":"The 1st and the 1,000th"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A 90% interval leaves 5% in each tail: 5% of 1,000 is 50, so the 50th and the 950th values.","misconceptions":["Gives the ends of the 95% interval","","Leaves 10% in each tail, which is an 80% interval","Takes the full range of the resamples, which grows with their number"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"bootstrap-distribution","title":"The middle 95% of the resampled medians is the interval"},"level":"apply","pool":"practice"},{"id":"q-bootstrap-03","type":"single","prompt":"A bootstrap interval for a median from 90 tickets is 4.8 to 7.9 hours with 2,000 resamples. The manager finds it too wide. Which action would narrow it?","options":[{"key":"A","text":"Raising the resamples to 200,000"},{"key":"B","text":"Reporting the 99% interval instead"},{"key":"C","text":"Collecting more tickets"},{"key":"D","text":"Resampling 45 tickets at a time"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The width is set by the information in the sample. Only more data narrow it; more resamples only steady the same interval.","misconceptions":["Confuses the number of resamples with the sample size","A higher level makes the interval wider, not narrower","","Smaller resamples vary more, which widens the interval and no longer matches the study"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"b-is-not-n","title":"More resamples smooth the picture; only more data narrow the interval"},"level":"analyze","pool":"practice"},{"id":"q-coverage-01","type":"single","prompt":"A consultant reports \"a 95% interval for the mean bill: 212 to 236 riyals\". Which statement describes what the 95% refers to?","options":[{"key":"A","text":"95% of all customers of the company have a monthly bill somewhere between 212 and 236 riyals"},{"key":"B","text":"The interval was computed from 95% of the customers"},{"key":"C","text":"The method produces intervals that contain the true mean in about 95 of 100 studies"},{"key":"D","text":"The sample mean is 95% of the true mean"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The level is the coverage of the method over repeated studies.","misconceptions":["Reads an interval for a mean as a range for single customers","Confuses the level with the share of data used","","Invents a relation between the level and the size of the estimate"],"lo":["LO1"],"day":2,"session":2,"slide":{"deck":"day2","id":"what-95-promises","title":"95% is a promise about the method, not about one interval"},"level":"understand","pool":"practice"},{"id":"q-coverage-02","type":"single","prompt":"To check an interval method, an analyst simulates 400 studies from a known population. In 368 of them the 95% interval contains the true value. What coverage did the method deliver?","options":[{"key":"A","text":"87%"},{"key":"B","text":"92%"},{"key":"C","text":"95%"},{"key":"D","text":"97%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"368 / 400 = 0.92. The method promised 95% and delivered 92% on this population.","misconceptions":["Divides by a wrong total","","Reports the promise in place of the count","Adds the shortfall instead of subtracting it"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"coverage-loop","title":"Coverage is measured by a loop and a count"},"level":"apply","pool":"practice"},{"id":"q-coverage-03","type":"single","prompt":"Claim payments at an insurer are mostly small, but about one claim in 2,000 is larger than all the others in a typical month together. An analyst bootstraps the mean payment from 150 claims. What should a coverage check be expected to show?","options":[{"key":"A","text":"Coverage near 95%, because the bootstrap needs no assumption about the shape of the data"},{"key":"B","text":"Coverage far below 95%, because most samples contain no very large claim"},{"key":"C","text":"Coverage above 95%, because the intervals are very wide"},{"key":"D","text":"Coverage of exactly 95%, because 150 is a large sample"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A sample without a rare huge claim has no information about it, so its interval for the mean sits too low. The bootstrap can only reuse what the sample holds.","misconceptions":["Believes \"no assumption\" means \"always valid\": the sample must still represent the population","","Expects wide intervals, but samples without a huge claim give narrow ones","Treats a fixed sample size as a guarantee whatever the shape of the data"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"when-bootstrap-fails","title":"The bootstrap fails where the sample cannot stand in for the population"},"level":"analyze","pool":"practice"},{"id":"q-unit-01","type":"single","prompt":"A study weighs 10 loaves from each of 30 bakeries chosen at random, 300 loaves in all, to estimate the mean weight of a loaf in the city. Which unit should a bootstrap resample?","options":[{"key":"A","text":"The loaf"},{"key":"B","text":"The bakery, with its 10 loaves"},{"key":"C","text":"The weighing scale"},{"key":"D","text":"Half of the loaves of each bakery"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Bakeries were drawn at random and loaves of one bakery resemble each other, so the bakery is the unit.","misconceptions":["Treats 300 loaves as independent although they come in groups of 10","","Names a tool, not a sampled unit","Keeps all 30 bakeries in every resample, so the variation between bakeries is never imitated"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"find-the-unit","title":"Resample the unit that was drawn at random"},"level":"apply","pool":"practice"},{"id":"q-unit-02","type":"single","prompt":"An analyst bootstraps rows of a two-stage survey (8 districts, 50 households each) and gets a 95% interval 0.3 points wide. A colleague resamples districts and gets 0.8 points. A simulation on a known population shows coverages of 61% and 93%. Which interval should be reported, and why?","options":[{"key":"A","text":"The narrow one, because it is more precise"},{"key":"B","text":"The narrow one, because it uses all 400 rows and so wastes none of the information"},{"key":"C","text":"The wide one, because its method keeps the promi
