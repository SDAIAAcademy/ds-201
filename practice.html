se of 95% most nearly"},{"key":"D","text":"Neither, because the two methods disagree"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval is judged by its coverage. The row bootstrap ignores that districts were sampled and misses the truth in 39% of studies.","misconceptions":["Mistakes a narrow interval for a good one: narrow and wrong is worse than wide and right","Both bootstraps use all rows; the difference is the unit, not the amount of data","","Disagreement is the finding: one method matches the design and one does not"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"unit-coverage","title":"Counted over 300 surveys, only the district bootstrap keeps the promise"},"level":"analyze","pool":"practice"},{"id":"q-unit-03","type":"single","prompt":"A file holds 600 satisfaction scores. Before bootstrapping, what does the analyst most need to find out?","options":[{"key":"A","text":"Whether the scores are whole numbers"},{"key":"B","text":"How the 600 respondents were selected"},{"key":"C","text":"Which software collected the scores"},{"key":"D","text":"Whether the file is sorted by score"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The resampling unit follows from the sampling design: respondents picked one by one, or in groups such as districts or branches.","misconceptions":["Looks at the format of the values, which does not decide the unit","","Looks at the tool, which says nothing about independence","Sorting does not change a bootstrap, which draws rows at random"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"two-stage-sample","title":"The survey team drew districts first, then households"},"level":"understand","pool":"practice"},{"id":"q-compare-01","type":"single","prompt":"Median delivery time is 40 minutes for courier X and 46 minutes for courier Y. A bootstrap gives a 95% interval for the ratio Y / X of 0.97 to 1.36. What can be said?","options":[{"key":"A","text":"Y is slower by between 3% and 36%"},{"key":"B","text":"Y may be anywhere from 3% faster to 36% slower"},{"key":"C","text":"Y is slower by 15%, with certainty"},{"key":"D","text":"The two couriers are equally fast"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval for the ratio includes 1, the value of no gap, and runs from 0.97 (3% faster) to 1.36 (36% slower).","misconceptions":["Reads 0.97 as \"3% slower\": a ratio below 1 means faster","","Drops the interval and treats the estimate as exact","Reads \"includes 1\" as proof of equality"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"difference-and-ratio","title":"Two intervals, one story, in two units"},"level":"apply","pool":"practice"},{"id":"q-compare-02","type":"single","prompt":"A study has 150 repairs by crew A and 90 by crew B. An analyst pools the 240 repairs, resamples 240 with replacement, splits them by crew label and takes the difference of medians. What is wrong with this bootstrap for the study as designed?","options":[{"key":"A","text":"It draws with replacement, which a difference between two groups does not allow in any bootstrap"},{"key":"B","text":"It lets the number of repairs per crew change from resample to resample"},{"key":"C","text":"It uses medians, which cannot be bootstrapped"},{"key":"D","text":"It resamples too few repairs"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The study fixed 150 and 90. Resampling the pool makes the group sizes random; each crew should be resampled on its own.","misconceptions":["Replacement is what every bootstrap uses","","Medians bootstrap well at these sizes","The resample has the size of the study, as it should"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"resample-each-group","title":"Resample each group on its own, then recompute the comparison"},"level":"analyze","pool":"practice"},{"id":"q-compare-03","type":"single","prompt":"A dashboard shows a 95% interval for branch A, 6.1 to 7.4, and for branch B, 7.0 to 8.6. They overlap. A manager concludes that the branches do not differ. What is the sound next step?","options":[{"key":"A","text":"Accept the conclusion, because overlapping intervals mean no difference"},{"key":"B","text":"Build the interval for the difference between the branches"},{"key":"C","text":"Widen both intervals to 99% and look again"},{"key":"D","text":"Compare the two lower ends only"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Overlap of two separate intervals is not a test. The interval for the difference itself can exclude zero even when the two intervals overlap.","misconceptions":["Uses the overlap rule of thumb, which is too conservative","","Wider intervals overlap more and answer nothing","Looks at one end of each interval, which is not a comparison"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"reading-zero-and-one","title":"An interval that includes \"no gap\" shows what is still possible, not that nothing is there"},"level":"evaluate","pool":"practice"},{"id":"q-permutation-01","type":"single","prompt":"Two call scripts were given to callers at random. To test the difference in mean call length, an analyst shuffles the script labels 5,000 times. What question do the 5,000 shuffled differences answer?","options":[{"key":"A","text":"How large a difference arises when the script has no effect"},{"key":"B","text":"How large the true effect of the new script on call length is in the population"},{"key":"C","text":"How long calls would be with a third script"},{"key":"D","text":"How many callers received the wrong script"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Shuffled labels carry no information about call length, so the shuffled differences show what chance alone produces.","misconceptions":["","Expects an effect size from a procedure that assumes there is no effect","Asks about a condition that was never observed","Mistakes the shuffle for an audit of the assignment"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"null-as-shuffle","title":"If the contractor makes no difference, the labels are arbitrary"},"level":"understand","pool":"practice"},{"id":"q-permutation-02","type":"single","prompt":"The observed difference in means is 1.8 minutes. Among 4,999 shuffles, 149 give a difference of 1.8 minutes or more in either direction. Counting the observed arrangement as one more shuffle, what is the two-sided p-value?","options":[{"key":"A","text":"0.003"},{"key":"B","text":"0.015"},{"key":"C","text":"0.030"},{"key":"D","text":"0.300"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"(149 + 1) / (4,999 + 1) = 150 / 5,000 = 0.030.","misconceptions":["Divides by ten times too many shuffles","Halves the count as if the test were one-sided","","Misplaces the decimal point"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"null-distribution","title":"Under shuffled labels a gap of 0.295 is rare"},"level":"apply","pool":"practice"},{"id":"q-permutation-03","type":"single","prompt":"A pilot compares the 90th percentile of waiting time between two service desks, 25 customers each. No standard formula for this comparison is at hand. Which approach gives a valid p-value?","options":[{"key":"A","text":"A t-test on the two means, with the result reported as a test of the 90th percentiles"},{"key":"B","text":"A comparison of the two bootstrap intervals by eye"},{"key":"C","text":"The larger of the two percentiles divided by the smaller"},{"key":"D","text":"A permutation test with the difference in 90th percentiles as its statistic"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A permutation test works for any statistic: shuffle the desk labels, recompute the difference in 90th percentiles, and count.","misconceptions":["Tests a different quantity from the one asked about","Overlap of two intervals is not a test","Gives an effect size and no measure of chance",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"when-they-differ","title":"Shuffle when the formula is doubtful or does not exist"},"level":"evaluate","pool":"practice"},{"id":"q-pvalue-01","type":"single","prompt":"A report states: \"The new reminder letter reduced late payment (p = 0.02).\" Which sentence says correctly what the 0.02 is?","options":[{"key":"A","text":"There is a 2% chance that the letter has no effect and a 98% chance that it reduced late payment by some amount"},{"key":"B","text":"The letter reduced late payment by 2%"},{"key":"C","text":"If the letter had no effect, a reduction at least this large would appear in about 2 studies of 100"},{"key":"D","text":"In 2% of customers the letter did not work"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A p-value is computed under the assumption of no effect: it is the share of such worlds with a result at least this extreme.","misconceptions":["Reads the p-value as the probability of the null hypothesis","Reads the p-value as an effect size","","Reads the p-value as a share of customers"],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"p-value-definition","title":"A p-value is the share of null worlds at least as extreme as yours"},"level":"understand","pool":"practice"},{"id":"q-pvalue-02","type":"single","prompt":"A trial with 18 pumps per group finds no significant difference in failures between two lubricants (p = 0.45). The maintenance lead writes: \"The lubricants are equivalent.\" What is the weakness of that sentence?","options":[{"key":"A","text":"A study this small would often give a large p-value even if one lubricant were clearly better"},{"key":"B","text":"A p-value of 0.45 means the lubricants differ in 45% of pumps"},{"key":"C","text":"The p-value should have been compared with 0.5, not 0.05"},{"key":"D","text":"Significance cannot be tested at all with fewer than 30 units per group, so the p-value is not valid"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A large p-value from a small study is absence of evidence. The interval for the difference would show how large a gap is still possible.","misconceptions":["","Reads the p-value as a share of units","Invents a threshold","States a rule of thumb as a law; small groups can be tested, with low power"],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"five-misreadings","title":"Five misreadings turn up again and again"},"level":"analyze","pool":"practice"},{"id":"q-pvalue-03","type":"single","prompt":"A team screens 200 ideas for reducing leaks. Experience says about 10 of 200 really work. Each is tested at the 0.05 level with a study that detects a working idea 60% of the time. About how many of the \"significant\" ideas are false alarms?","options":[{"key":"A","text":"About 5% of them"},{"key":"B","text":"About 20% of them"},{"key":"C","text":"About 40% of them"},{"key":"D","text":"About 60% of them"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"False alarms: 190 × 0.05 ≈ 9.5. True detections: 10 × 0.6 = 6. So about 9.5 of 15.5 significant results, roughly 60%, are false.","misconceptions":["Takes the 0.05 level for the share of false alarms among significant results","Guesses between the level and the truth without counting","Uses the share of misses among working ideas",""],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"p-is-not-prob-null","title":"Near p = 0.03, the null was true in 13% of studies, not 3%"},"level":"analyze","pool":"practice"},{"id":"q-effect-01","type":"single","prompt":"A new routing rule changes mean travel time per repair by -6 minutes (95% interval -9 to -3). Operations say that a saving of at least 5 minutes pays for the rule. How should the result be reported?","options":[{"key":"A","text":"A real saving; whether it reaches 5 minutes is not settled"},{"key":"B","text":"A real saving of more than 5 minutes"},{"key":"C","text":"No saving was shown"},{"key":"D","text":"A real saving that is too small to matter"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval excludes 0 and includes the threshold of 5 minutes: the saving is real, and it may be 3 or 9 minutes.","misconceptions":["","Reads the estimate and ignores that the interval reaches down to 3 minutes","Ignores that the interval excludes zero","Ignores that the interval reaches beyond the threshold"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"four-positions","title":"An interval can sit in four positions, and each has its own sentence"},"level":"apply","pool":"practice"},{"id":"q-effect-02","type":"single","prompt":"Satisfaction scores have a standard deviation of 2.0 points in both of two regions. The regions differ by 0.5 points in mean score. What is the standardised effect size d?","options":[{"key":"A","text":"0.10"},{"key":"B","text":"0.20"},{"key":"C","text":"0.25"},{"key":"D","text":"4.00"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"d is the difference divided by the standard deviation: 0.5 / 2.0 = 0.25.","misconceptions":["Divides by the square of the standard deviation and rounds","Divides by 2.5 instead of 2.0","","Divides the standard deviation by the difference"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"raw-and-standardised","title":"Report the raw effect for the decision, the standardised one for comparison"},"level":"apply","pool":"practice"},{"id":"q-effect-03","type":"single","prompt":"A simulation shows that a planned survey of 150 customers per group would detect a true gap of 0.3 points in 35% of studies. The survey is run and finds p = 0.21. What can be concluded about a gap of 0.3 points?","options":[{"key":"A","text":"It is ruled out, because the result is not significant and the survey was planned with a simulation"},{"key":"B","text":"It is confirmed, because the power was low"},{"key":"C","text":"It is half as likely as before the survey"},{"key":"D","text":"It remains plausible, because the survey would have missed it about two times in three"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With 35% power the survey says \"not significant\" in 65% of the worlds where the gap is real, so a non-significant result barely speaks against it.","misconceptions":["Reads a non-significant result from a weak study as proof of no gap","Turns low power into evidence for the effect","Invents a probability the analysis does not provide",""],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"power-for-a-question","title":"A study is powered for a question, not in general"},"level":"analyze","pool":"practice"},{"id":"q-multiple-01","type":"single","prompt":"A dashboard tests 60 branches against the company average each month at the 0.05 level. In a month in which no branch truly differs, about how many branches will be flagged?","options":[{"key":"A","text":"3"},{"key":"B","text":"0"},{"key":"C","text":"6"},{"key":"D","text":"12"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"60 × 0.05 = 3 false flags are expected when nothing differs.","misconceptions":["","Assumes that a 5% test gives no flags when nothing differs","Uses 10% in place of 5%","Uses 20% in place of 5%"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"false-alarms-expected","title":"One audit flags seven districts, and three of them are false alarms"},"level":"apply","pool":"practice"},{"id":"q-multiple-02","type":"single","prompt":"Five tests give the p-values 0.004, 0.011, 0.020, 0.030 and 0.400. Holm's method at 0.05 compares the smallest with 0.05/5, the next with 0.05/4, and so on, and stops at the first failure. How many hypotheses does it reject?","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"0.004 \u003c 0.010 passes; 0.011 \u003c 0.0125 passes; 0.020 \u003c 0.0167 fails, so Holm stops with 2 rejections.","misconceptions":["Compares every p-value with 0.05/5","","Rejects every p-value below 0.05, with no correction","Rejects all five because the smallest passed"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"two-promises","title":"Two corrections make two different promises"},"level":"apply","pool":"practice"},{"id":"q-multiple-03","type":"single","prompt":"A league table ranks 40 clinics by the share of patients seen within the target time. The five best and the five worst are all among the smallest clinics. Before any clinic is praised or inspected, what is the most likely explanation to check?","options":[{"key":"A","text":"Small clinics are managed either very well or very badly, with little in between, unlike large ones"},{"key":"B","text":"Small clinics report their data less carefully"},{"key":"C","text":"The target is unfair to clinics of middle size"},{"key":"D","text":"Shares based on few patients vary most, so small clinics land at both ends by chance"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An estimate from few cases has a large standard error, so the extremes of a ranking are filled by the smallest units whatever their true performance.","misconceptions":["Explains by management a pattern that sampling variation produces unaided","Proposes a data-quality cause without evidence when a simpler one exists","Blames the target for a pattern that is about sample size",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"small-districts-funnel","title":"The smallest districts give the most extreme estimates by chance"},"level":"analyze","pool":"practice"},{"id":"q-multiple-04","type":"single","prompt":"An analyst compares two billing layouts on complaint rates and finds nothing. She then splits customers by region, by age band and by tariff, and reports the one split in which the layouts differ at p = 0.04. No correction is applied. What is the problem with the reported result?","options":[{"key":"A","text":"It is the best of many looks, so its p-value overstates the evidence"},{"key":"B","text":"A p-value of 0.04 is too close to 0.05 to count"},{"key":"C","text":"Complaint rates cannot be compared between subgroups of customers of different size"},{"key":"D","text":"The subgroups were too large for a test"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each split is another test. The smallest of many p-values is often below 0.05 when nothing differs, so the plan and the number of looks must be reported.","misconceptions":["","Treats closeness to the level as the defect, when the defect is the number of looks","Subgroups can be compared; the looks have to be counted","Size is not the issue here; selection after seeing the data is"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"forking-paths","title":"Every choice made after seeing the data is another test"},"level":"analyze","pool":"practice"},{"id":"q-multiple-05","type":"single","prompt":"A screening of 500 pipe segments flags candidates for a cheap follow-up inspection. The team can accept that about one flag in ten is a false alarm, and wants to miss as few faulty segments as possible. Which procedure fits that aim?","options":[{"key":"A","text":"No correction at all, because the follow-up inspections are cheap and false alarms therefore cost little"},{"key":"B","text":"Holm at 0.05, because it is the strictest"},{"key":"C","text":"One test of all 500 segments together"},{"key":"D","text":"Benjamini-Hochberg at 10%, which limits the share of false alarms among the flags"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The stated tolerance is a share of false flags, which is what the false discovery rate controls. Holm guards against even one false flag and would miss more faulty segments.","misconceptions":["With 500 tests and no correction the false flags are not held to one in ten","Controls a stricter promise than the team asked for, at the cost of missed faults","Says whether something differs somewhere and names no segment",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"two-promises","title":"Two corrections make two different promises"},"level":"evaluate","pool":"practice"},{"id":"q-line-01","type":"single","prompt":"Electricity use of 800 flats is regressed on the number of rooms: use = 150 + 210 × rooms, in kilowatt-hours a month. A planner asks how much more a five-room flat uses than a three-room flat, on average. What does the line say?","options":[{"key":"A","text":"420 kilowatt-hours a month more"},{"key":"B","text":"210 kilowatt-hours a month more"},{"key":"C","text":"570 kilowatt-hours a month more"},{"key":"D","text":"1,200 kilowatt-hours a month more"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two more rooms at 210 kilowatt-hours each: 2 × 210 = 420. The intercept cancels in a difference.","misconceptions":["","Gives the slope for one room when the flats differ by two","Adds the intercept to a difference, where it cancels","Gives the predicted use of a five-room flat, not the difference"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"slope-in-units","title":"A slope is only useful in the manager's units"},"level":"apply","pool":"practice"},{"id":"q-line-02","type":"single","prompt":"Fuel use of delivery vans is regressed on the load carried, for loads between 200 and 900 kilograms: litres per 100 km = 7.5 + 0.004 × load. A colleague uses the line to budget fuel for a lorry carrying 12,000 kilograms. What is the main objection?","options":[{"key":"A","text":"The slope has no units and cannot be multiplied by a load"},{"key":"B","text":"The intercept of 7.5 shows that the line is biased"},{"key":"C","text":"The load is far outside the range the line was fitted on, where nothing shows the relation still holds"},{"key":"D","text":"A fitted line can be used only to describe the vans it was fitted on and never to predict the fuel use of any vehicle"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The data stop at 900 kilograms. A lorry is another kind of vehicle, and the line has no evidence about it.","misconceptions":["The slope has units: litres per 100 km for each kilogram","An intercept above zero is what an empty van would be expected to use","","Prediction inside the observed range is a sound use of a fitted line"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"intercept-and-range","title":"Predict inside the range you observed; read the intercept with care"},"level":"analyze","pool":"practice"},{"id":"q-line-03","type":"single","prompt":"A survey of 3,000 employees finds that each additional training day taken last year goes with 1.8 more points on the performance review. A report concludes: \"Sending an employee on one more training day will raise the review by 1.8 points.\" Which objection is the strongest?","options":[{"key":"A","text":"The sample of 3,000 is too small for a slope"},{"key":"B","text":"A slope cannot be estimated for a count such as days"},{"key":"C","text":"The slope should have been reported per hour of training and not per day, since days differ in length"},{"key":"D","text":"Employees who take more training may differ in other ways that also raise reviews"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The survey compares different employees. Motivation, role or manager may go with both training and reviews, so the slope is not the effect of sending one person.","misconceptions":["3,000 employees give a precise slope; precision is not the problem","Counts are ordinary predictors in a regression","A change of units rescales the slope and changes nothing about its meaning",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"goes-with-not-causes","title":"\"Goes with\" is not \"causes\""},"level":"evaluate","pool":"practice"},{"id":"q-line-04","type":"single","prompt":"Two analysts each draw 500 customers at random from the same billing system and regress bill on consumption. One finds a slope of 2.31 riyals per cubic metre, the other 2.42. Neither made an error. What explains the two values?","options":[{"key":"A","text":"A slope computed from a sample varies from sample to sample, like a mean"},{"key":"B","text":"The tariff changed between the two draws"},{"key":"C","text":"One of the two used the wrong formula"},{"key":"D","text":"Least squares gives a different answer each time it runs on the same data"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A fitted slope is a statistic. It has a sampling distribution and a standard error, like every estimate in this course.","misconceptions":["","Invents a cause when sampling variation is enough","Assumes that different results mean a mistake","Least squares is deterministic: the same data always give the same line"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"sample-and-population-line","title":"The slope is a statistic: another sample gives another slope"},"level":"understand","pool":"practice"},{"id":"q-slope-se-01","type":"single","prompt":"To bootstrap the slope of salary on years of experience for 600 employees, an analyst resamples the experience column and the salary column separately, each with replacement. The bootstrap slopes come out close to zero. Why?","options":[{"key":"A","text":"Too few resamples were drawn"},{"key":"B","text":"Salaries are skewed, which a bootstrap cannot handle"},{"key":"C","text":"Separate resampling breaks the link between each employee's two values"},{"key":"D","text":"The slope of the original sample was itself close to zero"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The unit is the employee. Drawing the two columns separately pairs one person's experience with another person's salary, which removes the relation.","misconceptions":["The number of resamples changes the steadiness of the result, not its centre","A pairs bootstrap makes no assumption about the shape of the data","","The original slope was not near zero; the resampling destroyed it"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"pairs-bootstrap","title":"Bootstrap the households: each one keeps its pair of values"},"level":"understand","pool":"practice"},{"id":"q-slope-se-02","type":"single","prompt":"In a regression of monthly sales on shop floor area, the residuals scatter within about 5,000 riyals for small shops and within about 40,000 riyals for large ones. What does this do to the output of the default formula?","options":[{"key":"A","text":"It biases the slope upward"},{"key":"B","text":"It makes the reported R² meaningless as a description of the fit"},{"key":"C","text":"It makes the reported p-value too large"},{"key":"D","text":"It makes the reported standard error of the slope too small"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Unequal spread leaves the slope a fair estimate. The default standard error assumes one spread everywhere, and it understates the uncertainty when the noisiest points sit at the end of the line.","misconceptions":["Unequal spread does not bias the least-squares slope","R² still describes how closely the points follow the line","A standard error that is too small makes p-values too small, not too large",""],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"equal-spread-assumption","title":"The formula assumes equal spread around the line; the data do not have it"},"level":"analyze","pool":"practice"},{"id":"q-slope-se-03","type":"single","prompt":"On a known population, an analyst draws 400 samples and builds two 95% intervals for a slope in each. The formula interval contains the true slope in 352 samples, the bootstrap interval in 381. What do the counts show?","options":[{"key":"A","text":"Coverage of 88% and 95%: the bootstrap interval keeps the promise and the formula interval does not"},{"key":"B","text":"Coverage of 95% for both, since both are 95% intervals"},{"key":"C","text":"Coverage of 12% and 5%: both intervals fail"},{"key":"D","text":"Coverage cannot be judged from 400 samples, since a count from so few samples is itself too uncertain to compare"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"352 / 400 = 88% and 381 / 400 = 95.25%. Coverage is counted, and the nominal level is only a promise.","misconceptions":["","Takes the label of the interval for its measured coverage","Reports the miss rates as if they were coverage","400 samples give coverage to within about two points, enough to separate 88% from 95%"],"lo":["LO2"],"day":4,"session":2,"slide":{"deck":"day4","id":"slope-coverage","title":"Counted over 300 samples, the bootstrap interval keeps the promise"},"level":"evaluate","pool":"practice"},{"id":"q-slope-se-04","type":"single","prompt":"A regression table shows for the variable \"distance_km\": coefficient 0.85, standard error 0.10, p \u003c 0.001. The outcome is delivery time in minutes. Which sentence reports the result best?","options":[{"key":"A","text":"Distance is a highly significant predictor of delivery time (p \u003c 0.001), so the routing model is confirmed"},{"key":"B","text":"The coefficient of distance is 0.85 with a standard error of 0.10"},{"key":"C","text":"Each additional kilometre goes with about 0.85 minutes more (95% interval about 0.65 to 1.05)"},{"key":"D","text":"Distance explains 85% of delivery time"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The coefficient in units, with its interval: 0.85 ± 2 × 0.10. The p-value answers \"is the slope zero\", which nobody asked.","misconceptions":["Reports the test and leaves out the size","Repeats the table without units or an interval","","Reads a coefficient as a share of variation explained"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"reading-regression-output","title":"Read a regression table in this order"},"level":"apply","pool":"practice"},{"id":"q-confound-01","type":"single","prompt":"Hospital stay in days is regressed on the number of medicines prescribed: 0.9 days per medicine. When the severity of the illness is added to the model, the slope on medicines falls to 0.2. What is the most likely reason?","options":[{"key":"A","text":"Severely ill patients get more medicines and also stay longer for other reasons"},{"key":"B","text":"The first model had too few patients"},{"key":"C","text":"Adding any second variable to a regression model always lowers the slopes of the variables already in it"},{"key":"D","text":"Severity was measured with error"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Severity is tied to both the number of medicines and the stay. Left out, its share of the stay was credited to medicines.","misconceptions":["","Blames sampling error for a change that comes from asking a different question","A variable unrelated to medicines would have left the slope where it was","Measurement error in severity would have left more of the confounding in place, not produced the drop"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"slope-moved","title":"Add temperature, and the slope on household size drops by 12 litres"},"level":"analyze","pool":"practice"},{"id":"q-confound-02","type":"single","prompt":"After regressing energy use of buildings on floor area, an analyst plots the residuals against the age of the building, a variable that is not in the model. The residuals rise steadily with age. What does the plot indicate?","options":[{"key":"A","text":"The slope on floor area is too large to be real"},{"key":"B","text":"Age should be removed from the dataset"},{"key":"C","text":"Age carries systematic information about energy use that the model is missing"},{"key":"D","text":"The residuals were computed wrongly, since they should always average zero"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A trend of residuals against a variable left out means that the variable explains part of what the model missed.","misconceptions":["The plot is about what is missing, not about the size of the fitted slope","A variable that explains the outcome is a reason to use it, not to drop it","","Residuals average zero overall and can still trend against another variable"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"residuals-vs-temperature","title":"The residuals of the one-variable line rise with temperature"},"level":"apply","pool":"practice"},{"id":"q-confound-03","type":"single","prompt":"A model of water use gives 98 litres per person with household size alone, and 86 litres per person once area temperature is included. A planner sizes the supply for one new scheme, in one area, for families of different sizes. Which figure fits her question?","options":[{"key":"A","text":"98, because it comes from the simpler model"},{"key":"B","text":"92, the average of the two"},{"key":"C","text":"Neither, because the two models contradict each other"},{"key":"D","text":"86, because within one area the temperature does not change"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Her comparison is between families in the same area, which is what \"holding temperature fixed\" describes.","misconceptions":["Simplicity does not make a slope answer a question it was not built for","Averages two answers to two different questions","The models answer different questions; they do not contradict",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"held-fixed","title":"Both slopes are right, for different questions"},"level":"evaluate","pool":"practice"},{"id":"q-confound-04","type":"single","prompt":"After adding three more variables, an analyst writes: \"All confounders are now controlled, so the slope is the causal effect.\" What is the weakness of the sentence?","options":[{"key":"A","text":"Three variables are too many for one model"},{"key":"B","text":"A slope is never related to a cause"},{"key":"C","text":"Controlling for more variables always makes a slope less precise, so the estimate has lost its value as evidence"},{"key":"D","text":"Only the measured variables were adjusted for; one that nobody measured may still be mixed in"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A regression adjusts for what is in the model. Only assignment by chance protects against the variables nobody thought of.","misconceptions":["A model with a few thousand rows carries three more variables easily","Overstates the limit: with assignment by chance a slope can estimate an effect","Often true, and beside the point of the claim",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"what-regression-cannot","title":"The new residuals are flat; the list of confounders is never known to be complete"},"level":"understand","pool":"practice"},{"id":"q-brief-01","type":"single","prompt":"A manager asks: \"Are customers happier with the new app?\" Which line turns the question into an estimand?","options":[{"key":"A","text":"The difference in mean satisfaction score between app users and other customers surveyed this quarter"},{"key":"B","text":"A permutation test with 5,000 shuffles"},{"key":"C","text":"Whether the app is good"},{"key":"D","text":"The satisfaction scores of all customers in the survey file for this quarter, with a column that marks the app users"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An estimand names one quantity, the population and the two groups compared.","misconceptions":["","Names a method, not the quantity to be estimated","Restates the question without a quantity or a population","Names the data, not a number to estimate"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"question-to-estimand","title":"Turn the question into an estimand: one number in a named population"},"level":"apply","pool":"practice"},{"id":"q-brief-02","type":"single","prompt":"An analyst must put an interval on the share of 350 sampled invoices that were paid late, and has only the bootstrap code written for a mean. What is the sound way forward?","options":[{"key":"A","text":"Wait for a method specific to shares"},{"key":"B","text":"Bootstrap the median payment delay instead"},{"key":"C","text":"Code each invoice 1 if late and 0 if not, and bootstrap the mean of that column"},{"key":"D","text":"Report the share with no interval, since shares are exact"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A share is the mean of a column of zeros and ones, so the bootstrap for a mean applies unchanged.","misconceptions":["Assumes each statistic needs its own recipe","Answers a different question from the one asked","","A share from a sample has sampling error like any estimate"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"share-is-a-mean","title":"A new question needs no new method: a share is a mean of zeros and ones"},"level":"apply","pool":"practice"},{"id":"q-brief-03","type":"single","prompt":"Four closing sentences are proposed for a brief on repair times drawn from one year of logged tickets. Which one states a limit a manager can use?","options":[{"key":"A","text":"These results rest on a sample and on logged data, and they should therefore be interpreted with a suitable degree of caution"},{"key":"B","text":"More research is needed"},{"key":"C","text":"Statistics can never prove anything"},{"key":"D","text":"Tickets closed late in the system count as slow repairs, so the true share within the standard may be higher"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A useful limit names what could be wrong and in which direction.","misconceptions":["A ritual sentence that names no specific risk","Says nothing about what is uncertain here","A general remark that would fit any study",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"limits-worth-stating","title":"Limits worth stating fall into four kinds"},"level":"evaluate","pool":"practice"},{"id":"q-brief-04","type":"single","prompt":"A draft reads: \"Mean resolution time fell from 31 to 27 hours after the new rule (p = 0.03), so the rule works.\" The data are complaints from the month before and the month after the change. What must be added before a manager acts on it?","options":[{"key":"A","text":"An interval for the 4-hour change, and the limit that the two months may differ for other reasons"},{"key":"B","text":"A second p-value from another test, such as a classical test, to confirm that the first one was computed correctly"},{"key":"C","text":"More decimal places for the two means"},{"key":"D","text":"The number of resamples used"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The size needs an interval, and a before-and-after comparison cannot separate the rule from anything else that changed between the months.","misconceptions":["","A second test adds no information about size or design","Precision of printing is not precision of the estimate","A method detail that belongs in the notebook"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"brief-paragraph","title":"One paragraph: estimate, interval, comparison, population, limits"},"level":"analyze","pool":"practice"},{"id":"q-weights-01","type":"single","prompt":"Zulal surveys customer satisfaction. To report on its 200 commercial customers it phones 100 of them, and it phones 300 of its 40,000 residential customers at random. Commercial customers score 5.0 on average in the sample, residential 7.0. What estimate of mean satisfaction over all 40,200 customers follows from the design?","options":[{"key":"A","text":"6.5, the mean of all 400 responses"},{"key":"B","text":"6.0, the mean of the two group means"},{"key":"C","text":"5.5, because the commercial customers were drawn more carefully and so count for more"},{"key":"D","text":"About 7.0, each group weighted by its N / n"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each commercial response stands for 2 customers and each residential one for about 133. Weighted, the residential group dominates: (200 × 5.0 + 40,000 × 7.0) / 40,200 is about 6.99.","misconceptions":["Counts every row the same, so the oversampled group gets a quarter of the weight instead of half a percent","Gives the two groups equal weight although one is 200 times larger","Confuses the care of the design with the size of the group it stands for",""],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"design-weights","title":"Weight each row by N / n and the regional mean comes back"},"level":"apply","pool":"practice"},{"id":"q-extremes-01","type":"single","prompt":"Ilyas ranks the 30 districts by a quarterly complaint rate and sends a support team to the five worst. Next quarter their rate falls by a third, and Nizar wants to roll the team out everywhere. Most of the five are small districts. What should Ilyas say first?","options":[{"key":"A","text":"The fall is real, because it is large and happened in all five districts at once"},{"key":"B","text":"The team works only if a before-and-after test on the five gives p below 0.05"},{"key":"C","text":"Compare the five with the five best districts over the same quarter"},{"key":"D","text":"Part of the fall is expected anyway; compare with equally bad districts left out by lot"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Districts picked for being extreme, especially small ones, are partly extreme by chance and drift back next quarter. A concurrent comparison among equally extreme districts, assigned by lot, regresses the same way on both sides and isolates the team's effect.","misconceptions":["Takes the size and consistency of the fall as proof, although selection on extremes produces both","A significant before-and-after test still credits regression to the mean to the team","The best districts drift down as the worst drift up, so this comparison doubles the bias instead of removing it",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"extremes-need-a-control","title":"Among equally extreme districts, treat half by lot and compare the changes"},"level":"analyze","pool":"practice"},{"id":"q-precision-01","type":"single","prompt":"A meter-fault flag is checked on 200 faulty meters and 200 sound ones: it flags 180 faulty and 20 sound, a precision of 90% on the set. In the region 2% of meters are faulty. What share of flagged meters will be faulty in the field?","options":[{"key":"A","text":"90%, the precision measured on the balanced set of 400 meters"},{"key":"B","text":"50%, the share of faulty meters among the 400 that were checked"},{"key":"C","text":"About 16%, once each class is weighted back"},{"key":"D","text":"2%, the share of faulty meters in the region as a whole"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Sensitivity 0.9 and false-alarm rate 0.1 carry over; the mix does not. 0.9 × 0.02 / (0.9 × 0.02 + 0.1 × 0.98) is about 0.155.","misconceptions":["Treats precision as a property of the flag, although it depends on how common faults are","Reads the prevalence from a set whose mix the analyst fixed at half and half","","Forgets that the flag raises the share above the base rate by selecting likely faults"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"precision-reweighted","title":"Weight each class back to its count on file, then recompute the share"},"level":"apply","pool":"practice"}]}</script>
